<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhon Yaung Thit Delivery</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f1f5f9;
 color:#172554;
}
header{
 background:#123b72;
 color:white;
 padding:22px;
 text-align:center;
}
header h2{margin:0}
.container{
 max-width:650px;
 margin:20px auto;
 padding:15px;
}
.card{
 background:white;
 padding:20px;
 border-radius:14px;
 margin-bottom:18px;
 box-shadow:0 3px 12px #0001;
}
h3{color:#123b72}
input,textarea{
 width:100%;
 padding:13px;
 margin:8px 0 15px;
 border:1px solid #cbd5e1;
 border-radius:8px;
 font-size:15px;
}
button{
 background:#f59e0b;
 color:#172554;
 border:0;
 padding:13px;
 width:100%;
 border-radius:8px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
.secondary{
 background:#123b72;
 color:white;
 margin-top:10px;
}
.order{
 border-bottom:1px solid #ddd;
 padding:12px 0;
}
.small{font-size:13px;color:#64748b}
#message{font-weight:bold}
</style>
</head>

<body>

<header>
<h2>🚚 ဘုန်းရောင်သစ် Delivery</h2>
<p>Fast • Safe • Reliable</p>
</header>

<div class="container">

<div class="card">
<h3>📦 Customer Order Form</h3>

<form id="orderForm">

<label>ပေးပို့သူအမည်</label>
<input name="sender_name" required>

<label>ပေးပို့သူဖုန်း</label>
<input name="sender_phone" required>

<label>ပစ္စည်းယူမည့်လိပ်စာ</label>
<textarea name="pickup_address" required></textarea>

<label>လက်ခံသူအမည်</label>
<input name="receiver_name" required>

<label>လက်ခံသူဖုန်း</label>
<input name="receiver_phone" required>

<label>ပစ္စည်းပို့မည့်လိပ်စာ</label>
<textarea name="delivery_address" required></textarea>

<label>ပစ္စည်းအမျိုးအစား</label>
<input name="item_type" required>

<label>ပစ္စည်းတန်ဖိုး (ကျပ်)</label>
<input name="item_value" type="number" min="0" value="0">

<label>COD ငွေ (ကျပ်)</label>
<input name="cod_amount" type="number" min="0" value="0">

<label>အထူးမှာကြားချက်</label>
<textarea name="special_instructions"></textarea>

<button type="submit">Order တင်မည်</button>

<p id="message"></p>
</form>
</div>

<div class="card">
<h3>🔐 Owner Login</h3>

<form id="loginForm">
<label>Email</label>
<input name="email" type="email" required>

<label>Password</label>
<input name="password" type="password" required>

<button type="submit" class="secondary">
Owner Login
</button>
</form>

<p id="loginMessage"></p>
</div>

<div class="card" id="dashboard" hidden>
<h3>🏠 Owner Dashboard</h3>
<p id="ownerName"></p>
<h3>📦 Order စာရင်း</h3>
<div id="orders"></div>
<button id="refresh" class="secondary">Refresh</button>
<button id="logout" class="secondary">Logout</button>
</div>

</div>

<script>

// Supabase Project Information
const SUPABASE_URL = " https://uwemhzbqlelhpqkiupua.supabase.co  ";
const SUPABASE_KEY = "sb_publishable_sXHV9xzf2ca55ZMr23xRRg_cVBNyoJ7";

const db = supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

// Customer Order
document.getElementById("orderForm")
.addEventListener("submit",async function(e){

 e.preventDefault();

 const form = new FormData(this);

 const order = {
  sender_name:form.get("sender_name"),
  sender_phone:form.get("sender_phone"),
  pickup_address:form.get("pickup_address"),
  receiver_name:form.get("receiver_name"),
  receiver_phone:form.get("receiver_phone"),
  delivery_address:form.get("delivery_address"),
  item_type:form.get("item_type"),
  item_value:Number(form.get("item_value")||0),
  cod_amount:Number(form.get("cod_amount")||0),
  special_instructions:form.get("special_instructions")
 };

 const message=document.getElementById("message");
 message.textContent="Order ပို့နေပါသည်...";

 const {error}=await db
 .from("orders")
 .insert(order);

 if(error){
  message.textContent="Order မအောင်မြင်ပါ။ ပြန်ကြိုးစားပါ။";
  console.error(error);
 }else{
  message.textContent="✅ Order လက်ခံရရှိပါပြီ။ ကျေးဇူးတင်ပါတယ်။";
  this.reset();
 }
});

// Owner Login
document.getElementById("loginForm")
.addEventListener("submit",async function(e){

 e.preventDefault();

 const form=new FormData(this);

 const {data,error}=await db.auth.signInWithPassword({
  email:form.get("email"),
  password:form.get("password")
 });

 const msg=document.getElementById("loginMessage");

 if(error){
  msg.textContent="Login မအောင်မြင်ပါ။";
  return;
 }

 const {data:profile,error:profileError}=await db
 .from("profiles")
 .select("full_name,role")
 .eq("id",data.user.id)
 .single();

 if(profileError || profile.role!=="owner"){
  await db.auth.signOut();
  msg.textContent="Owner Account သာ ဝင်ခွင့်ရှိပါသည်။";
  return;
 }

 document.getElementById("dashboard").hidden=false;
 document.getElementById("ownerName").textContent=
 "မင်္ဂလာပါ "+profile.full_name;

 await loadOrders();
});

// Load Orders
async function loadOrders(){

 const box=document.getElementById("orders");
 box.textContent="စာရင်းဖတ်နေပါသည်...";

 const {data,error}=await db
 .from("orders")
 .select("*")
 .order("created_at",{ascending:false})
 .limit(100);

 if(error){
  box.textContent="စာရင်းဖတ်မရပါ။";
  return;
 }

 if(!data.length){
  box.textContent="Order မရှိသေးပါ။";
  return;
 }

 box.innerHTML="";

 data.forEach(o=>{

  const item=document.createElement("div");
  item.className="order";

  const title=document.createElement("b");
  title.textContent=o.order_number;

  const detail=document.createElement("p");
  detail.textContent=
   "ပေးပို့သူ: "+o.sender_name+
   " | လက်ခံသူ: "+o.receiver_name;

  const address=document.createElement("p");
  address.textContent="လိပ်စာ: "+o.delivery_address;

  const cod=document.createElement("p");
  cod.textContent="COD: "+Number(o.cod_amount).toLocaleString()+" ကျပ်";

  const status=document.createElement("p");
  status.textContent="အခြေအနေ: "+o.status;

  item.append(title,detail,address,cod,status);
  box.appendChild(item);
 });
}

document.getElementById("refresh")
.addEventListener("click",loadOrders);

document.getElementById("logout")
.addEventListener("click",async()=>{
 await db.auth.signOut();
 location.reload();
});

</script>
</body>
</html>
