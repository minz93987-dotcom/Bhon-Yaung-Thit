"YOUR_PUBLISHABLE_KEY";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// CUSTOMER ORDER FORM

document.getElementById("orderForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const form = new FormData(this);

    const order = {

        sender_name: form.get("sender_name"),
        sender_phone: form.get("sender_phone"),
        pickup_address: form.get("pickup_address"),

        receiver_name: form.get("receiver_name"),
        receiver_phone: form.get("receiver_phone"),
        delivery_address: form.get("delivery_address"),

        item_type: form.get("item_type"),

        item_value: Number(form.get("item_value") || 0),

        cod_amount: Number(form.get("cod_amount") || 0),

        special_instructions:
        form.get("special_instructions")

    };

    const msg = document.getElementById("orderMessage");

    msg.textContent = "Order ပို့နေပါသည်...";

    const { error } = await db
        .from("orders")
        .insert(order);

    if(error) {

        msg.textContent =
        "Order မအောင်မြင်ပါ။ ပြန်လည်ကြိုးစားပါ။";

        console.error(error);

    } else {

        msg.textContent =
        "✅ Order လက်ခံရရှိပါပြီ။ ကျေးဇူးတင်ပါတယ်။";

        this.reset();

    }

});


// OWNER LOGIN

document.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const form = new FormData(this);

    const msg = document.getElementById("loginMessage");

    msg.textContent = "Login ဝင်နေပါသည်...";

    const { data, error } = await db.auth
        .signInWithPassword({

            email: form.get("email"),
            password: form.get("password")

        });

    if(error) {

        msg.textContent = "Login မအောင်မြင်ပါ။";

        return;

    }

    const { data: profile, error: profileError } =
        await db
        .from("profiles")
        .select("full_name, role")
        .eq("id", data.user.id)
        .single();

    if(profileError || !profile || profile.role !== "owner") {

        await db.auth.signOut();

        msg.textContent =
        "Owner Account သာ ဝင်ခွင့်ရှိပါသည်။";

        return;

    }

    document.getElementById("dashboard").hidden = false;

    document.getElementById("ownerName").textContent =
        "မင်္ဂလာပါ " + profile.full_name;

    msg.textContent = "Login အောင်မြင်ပါသည်။";

    await loadOrders();

});
